# Firebase App Hosting — backend: lightforge-app (us-central1)
# Live URL: https://lightforge-app--lightforge-2cf3b.us-central1.hosted.app
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  runtime: nodejs22
  concurrency: 80
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 10

env:
  - variable: NEXT_PUBLIC_APP_URL
    value: https://lightforge-app--lightforge-2cf3b.us-central1.hosted.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: lightforge-2cf3b
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIRESTORE_DATABASE_ID
    value: lightforge
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: lightforge-2cf3b.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: lightforge-2cf3b.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_STORAGE_BUCKET
    value: lightforge-2cf3b.firebasestorage.app
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: '1012853146594'
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:1012853146594:web:5a3336b0022eda8cb1afbb
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-Q5B7R9M3TV
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBWRVsS6MS9kzhBoVNqBJlDWuoQkl0C6qA
    availability:
      - BUILD
      - RUNTIME
  - variable: SESSION_COOKIE_NAME
    value: __session
    availability:
      - RUNTIME
  - variable: SESSION_COOKIE_MAX_AGE_DAYS
    value: '14'
    availability:
      - RUNTIME
  - variable: PNPM_CONFIG_MINIMUM_RELEASE_AGE
    value: '0'
    availability:
      - BUILD
  - variable: PNPM_CONFIG_FROZEN_LOCKFILE
    value: 'false'
    availability:
      - BUILD
  # Optional Stripe — create secrets then uncomment:
  # firebase apphosting:secrets:set STRIPE_SECRET_KEY --project lightforge-2cf3b
  # firebase apphosting:secrets:grantaccess STRIPE_SECRET_KEY --backend lightforge-app --project lightforge-2cf3b
